<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação de Palavras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo">
    <header>
      <h1>Adivinhe a Palavra</h1>
      <p class="subtitulo">Categoria: <strong id="categoria">...</strong></p>
      <p class="dica">💡 Dica: <span id="dica">...</span></p>
    </header>

    <section class="painel-palavra" aria-label="Palavra secreta">
      <p id="palavra">_ _ _ _ _</p>
    </section>

    <section class="controles">
      <p>Tentativas restantes: <strong id="tentativas">6</strong></p>

      <div class="entrada">
        <label for="letra">Digite uma letra:</label>
        <input id="letra" type="text" maxlength="1" autocomplete="off">
        <button id="btn-tentar" type="button">Tentar</button>
      </div>

      <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </section>

    <section class="historico">
      <p>Letras utilizadas: <span id="letras-usadas">Nenhuma</span></p>
    </section>

    <footer class="rodape">
      <div class="placar">
        <span>Partidas: <strong id="total-partidas">0</strong></span>
        <span>Vitórias: <strong id="vitorias">0</strong></span>
        <span>Derrotas: <strong id="derrotas">0</strong></span>
      </div>
      <button id="btn-reiniciar" type="button">Nova partida</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
